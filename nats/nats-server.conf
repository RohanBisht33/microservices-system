# NATS Server Configuration for Microservices System

port: 4222
monitor_port: 8222

# Enable JetStream persistence
jetstream {
  store_dir: "/tmp/nats/jetstream"
  max_mem: 1Gi
  max_file: 5Gi
}

# TLS configuration (Dev setup: self-signed certs)
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file:  "/etc/nats/certs/server.key"
  ca_file:   "/etc/nats/certs/ca.crt"
  timeout: 5
}

# Authentication configuration
authorization {
  token: "dev_nats_token_sec_123"
}
